<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MoBetter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="dot" id="dot" title="connection"></span><h1>MoBetter</h1><span class="sub" id="model"></span><span class="sub" id="sub">connecting…</span></div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-view="home">Home</button>
    <button class="tab" data-view="setup">Setup</button>
  </nav>
  <button class="power" id="power" aria-label="Power"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
</header>

<main id="home" class="view">
  <section class="card vol">
    <div class="vol-head">
      <div class="readout"><span id="volnum">--</span><span class="unit">dB</span></div>
      <button class="chip mute" id="mute">Mute</button>
    </div>
    <div class="vol-row">
      <button class="step" id="vdn" aria-label="Volume down">−</button>
      <input type="range" id="vol" min="-805" max="165" step="5" value="-500" aria-label="Volume">
      <button class="step" id="vup" aria-label="Volume up">+</button>
    </div>
    <div class="note" id="volnote"></div>
  </section>

  <section class="card">
    <h2>Input</h2>
    <div class="chips" id="inputs"></div>
  </section>

  <section class="card">
    <h2>Sound</h2>
    <div class="toggles" id="toggles"></div>
    <label class="field"><span>Sound program</span><select id="program"></select></label>
  </section>

  <section class="card">
    <h2>Tone &amp; levels</h2>
    <div id="sliders"></div>
    <div class="chips small" id="extras"></div>
  </section>

  <section class="card wide">
    <h2>Scenes</h2>
    <div class="chips grid" id="scenes"></div>
  </section>
</main>

<main id="setup" class="view hidden">
  <section class="card wide">
    <h2>Setup</h2>
    <p class="muted">Every setting the receiver offers, in the same groups as its own Web Setup (<a id="oldlink" href="#">still available</a>). Pick a group.</p>
    <div class="chips" id="cats"></div>
    <div id="catbody"></div>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="setup.js"></script>
<script src="app.js"></script>
</body>
</html>
